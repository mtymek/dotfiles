# hypridle - standalone idle daemon for suspend-on-idle.
#
# Omarchy's Quickshell idle service already handles screensaver + lock; this
# file ONLY adds system suspend, so the two coexist without conflict. Both are
# independent listeners on Hyprland's idle protocol.
#
# Note: this runs outside omarchy's "stay awake" state, so suspend fires on a
# fixed timeout regardless of that toggle.

general {
  # Respect apps that inhibit idle (video players, games, etc.)
  ignore_dbus_inhibit = false
  # Safety net: ensure the screen is locked before suspending.
  before_sleep_cmd = omarchy system lock
}

listener {
  # 30 min. Change to taste (must be longer than omarchy's idle.lock).
  timeout = 1800
  on-timeout = systemctl suspend
}
